<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
               background: #1b2d75; color: #1b1d3a; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
        main { max-width: 520px; padding: 32px; background: #f7f7fb; border-radius: 8px; }
        h1 { margin: 0 0 12px; font-size: 28px; color: #1a1c4f; }
        p { margin: 0 0 20px; font-size: 17px; line-height: 1.5; }
        a { display: inline-block; padding: 10px 18px; background: #e6b53c; border-radius: 6px;
            color: #1a1c4f; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <h1>Something went wrong</h1>
        <p>The site hit a problem on its side. Nothing you did caused it. Please try again in a minute.</p>
        <a href="/">Go to the home page</a>
    </main>
</body>
</html>
