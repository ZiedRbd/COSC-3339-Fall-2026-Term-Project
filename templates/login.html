{%extends "base.html"%}
{% load static %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">

{%block content%}
<div class="login-field">
  <div class="stacked">
    {% if form.email.errors or form.password.errors %}<div class="error"><p>Email or Password is incorrect</p></div>{% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.email }}

      {{ form.password }}

      <button>Log in</button>
    </form>

    <a href="{% url 'register' %}" class="btn-link">Need an account? Register</a>
  </div>
</div>
{%endblock%}
