server {
    listen 80;
    server_name campusdesk.duckdns.org;

    # Profile pictures may be up to 2 MB; nginx stops at 1 MB unless told otherwise
    client_max_body_size 5m;

    location /static/ {
        alias /srv/campusdesk/staticfiles/;
    }

    # Uploaded files, served straight from disk
    location /media/ {
        alias /srv/campusdesk/media/;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/campusdesk/gunicorn.sock;
    }
}
